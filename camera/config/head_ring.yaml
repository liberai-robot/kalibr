# head_ring 桥接配置 (camera_ros_bridge_node.py 读取)
# 采集端相机参数 (type/resolution/fps/帧同步等) 由另一工程 slam_device/head_ring 管理。

zenoh:
  prefix: head_ring        # zenoh key 前缀: head_ring/cam_0/image, head_ring/imu ...
  # 默认走本机 multicast scouting 自动发现，无需额外配置。
  # 跨机器时可指定 endpoints，例如: connect: ["tcp/192.168.1.10:7447"]
  connect: []
  listen: []

camera:
  # 四路相机 topic 名，顺序即 cam_index 顺序 (与采集端一致)
  topics: [cam_0, cam_1, cam_2, cam_3]
